# Pomočnik infra — single EU-region host, Docker Compose (D4).
#
# Business Postgres/Auth/Storage is Supabase Cloud (ADR-0003) — NOT a service here.
# Everything else — our app, our worker, our queue, and the entire Paperless-ngx stack —
# runs on this host, per D4 and the GPL boundary in D3 (Paperless is an unmodified image,
# reached only over its REST API; see src/lib/paperless/).
#
# Pinned versions (see docs/adr/ for anything debatable about these choices):
#   paperless-ngx  3.1.3   (searched at plan time: latest stable release line)
#   postgres       16      (Paperless's own DB — never queried by our code, D3)
#   redis          7       (two independent instances: Paperless's broker, our BullMQ queue)
#   gotenberg      8       (Office -> PDF, used by Paperless)
#   tika           2.9.2.1-full (Office parsing, used by Paperless)
#
# Bring up just Paperless + its dependencies for the Phase 0 spike:
#   docker compose --profile paperless up -d
# Bring up everything (Phase 1+):
#   docker compose up -d

name: pomocnik

networks:
  pomocnik:
    driver: bridge

volumes:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
  postgres-paperless-data:
  redis-paperless-data:
  redis-app-data:

services:
  # ---------------------------------------------------------------------------------------
  # Paperless-ngx — the document engine (D1). Unmodified image, REST API only (D3).
  # ---------------------------------------------------------------------------------------

  postgres-paperless:
    image: postgres:16-alpine
    profiles: ["paperless", "full"]
    restart: unless-stopped
    networks: [pomocnik]
    environment:
      POSTGRES_DB: ${PAPERLESS_DBNAME:-paperless}
      POSTGRES_USER: ${PAPERLESS_DBUSER:-paperless}
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:?set in .env}
    volumes:
      - postgres-paperless-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DBUSER:-paperless}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-paperless:
    image: redis:7-alpine
    profiles: ["paperless", "full"]
    restart: unless-stopped
    networks: [pomocnik]
    volumes:
      - redis-paperless-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: ["paperless", "full"]
    restart: unless-stopped
    networks: [pomocnik]
    # Paperless's own guidance: disable the routes it doesn't use, on principle of least
    # exposure for a service reachable only from the internal network anyway.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    image: apache/tika:2.9.2.1-full
    profiles: ["paperless", "full"]
    restart: unless-stopped
    networks: [pomocnik]

  # paperless-webserver: web UI/API, the built-in task scheduler, and (by default, inside
  # this same container) the consumer + Celery workers. See paperless-worker below for why
  # OCR work is split into its own container instead of relying on that default.
  paperless-webserver:
    image: paperlessngx/paperless-ngx:3.1.3
    profiles: ["paperless", "full"]
    restart: unless-stopped
    networks: [pomocnik]
    depends_on:
      postgres-paperless: { condition: service_healthy }
      redis-paperless: { condition: service_healthy }
      gotenberg: { condition: service_started }
      tika: { condition: service_started }
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://redis-paperless:6379
      PAPERLESS_DBHOST: postgres-paperless
      PAPERLESS_DBNAME: ${PAPERLESS_DBNAME:-paperless}
      PAPERLESS_DBUSER: ${PAPERLESS_DBUSER:-paperless}
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS:?set in .env}
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      # Slovenian + English OCR (D7) — verify the slv language pack is actually present in
      # this image during the Phase 0 OCR spike; some Paperless images need
      # PAPERLESS_OCR_LANGUAGES to trigger a language-pack install on first boot.
      PAPERLESS_OCR_LANGUAGE: slv+eng
      PAPERLESS_OCR_LANGUAGES: slv eng
      PAPERLESS_TIME_ZONE: Europe/Ljubljana
      PAPERLESS_URL: ${PAPERLESS_URL:?set in .env, e.g. https://paperless.internal}
      # The event bridge (specs/01-architecture.md §Event bridge) — never blocks consumption
      # on our error, per that spec's explicit requirement.
      PAPERLESS_POST_CONSUME_SCRIPT: /scripts/notify-pomocnik.sh
      # Split OCR/Celery work into paperless-worker below rather than this container.
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "1"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
      - ./scripts/notify-pomocnik.sh:/scripts/notify-pomocnik.sh:ro
    ports:
      # Exposed to the host only for local/dev access during Phase 0; nginx is the only
      # public entrypoint once Phase 1's app is in front of it (see infra/nginx/).
      - "127.0.0.1:8010:8000"

  # paperless-worker: OCR/Celery work in its own container(s), separate from day one (D4) so
  # this can move to a dedicated-vCPU host under load without re-architecture. This split is
  # a documented community pattern, not an officially packaged Paperless deployment mode —
  # verify it against the pinned 3.1.3 image during the Phase 0 import-throughput spike before
  # relying on it for a real import.
  paperless-worker:
    image: paperlessngx/paperless-ngx:3.1.3
    profiles: ["paperless", "full"]
    restart: unless-stopped
    networks: [pomocnik]
    depends_on:
      postgres-paperless: { condition: service_healthy }
      redis-paperless: { condition: service_healthy }
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://redis-paperless:6379
      PAPERLESS_DBHOST: postgres-paperless
      PAPERLESS_DBNAME: ${PAPERLESS_DBNAME:-paperless}
      PAPERLESS_DBUSER: ${PAPERLESS_DBUSER:-paperless}
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS:?set in .env}
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_OCR_LANGUAGE: slv+eng
      PAPERLESS_OCR_LANGUAGES: slv eng
      PAPERLESS_TIME_ZONE: Europe/Ljubljana
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    command: ["celery", "--app", "paperless", "worker", "--loglevel", "INFO"]
    deploy:
      # Resource budget (specs/10-nonfunctional.md, Phase 5 hardening) — placeholder limits,
      # to be measured and tuned under real load in Phase 5, not assumed correct here.
      resources:
        limits:
          cpus: "4"
          memory: 4G

  # ---------------------------------------------------------------------------------------
  # Our stack — Next.js app, worker, queue. Supabase (Postgres/Auth/Storage) is Cloud, not
  # a service here (ADR-0003).
  # ---------------------------------------------------------------------------------------

  redis-app:
    image: redis:7-alpine
    profiles: ["full"]
    restart: unless-stopped
    networks: [pomocnik]
    volumes:
      - redis-app-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: ["full"]
    restart: unless-stopped
    networks: [pomocnik]
    env_file: .env
    environment:
      REDIS_URL: redis://redis-app:6379
    depends_on:
      redis-app: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    profiles: ["full"]
    restart: unless-stopped
    networks: [pomocnik]
    env_file: .env
    environment:
      REDIS_URL: redis://redis-app:6379
    depends_on:
      redis-app: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    profiles: ["full"]
    restart: unless-stopped
    networks: [pomocnik]
    depends_on: [web]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # TLS certs (Let's Encrypt) — mounted from the host's certbot output. Not managed by
      # this compose file; see docs/SETUP.md for the certbot/renewal setup.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
