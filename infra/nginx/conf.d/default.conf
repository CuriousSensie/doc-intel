# /api/internal/* must never be reachable from outside the Docker network.

server {
  listen 80;
  server_name _;

  # TODO(Phase 5): redirect to https once Let's Encrypt certs are provisioned (docs/SETUP.md).

  location /api/internal/ {
    deny all;
    return 404;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# HTTPS block added by certbot on first issuance (docs/SETUP.md) — not hand-authored here.
