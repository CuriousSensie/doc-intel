# Pomočnik — nginx site config.
#
# Security requirement (specs/01-architecture.md §Event bridge, specs/12-agent-rules.md):
# /api/internal/* is bound to the Docker network only — it must never be reachable from
# outside, even though Next.js also serves it. That's the one hard rule this file exists to
# enforce; everything else proxies to the app.

server {
  listen 80;
  server_name _;

  # TODO(Phase 5): redirect to https once Let's Encrypt certs are provisioned
  # (docs/SETUP.md documents the certbot setup this depends on).

  location /api/internal/ {
    deny all;
    return 404;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# HTTPS server block is added by the certbot/Let's Encrypt setup documented in docs/SETUP.md
# (it rewrites this file in place on first issuance) — not hand-authored here to avoid
# shipping a cert path that doesn't exist yet on a clean checkout.
