user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Uploads go direct-to-storage (specs/01-architecture.md §Upload) — this app process never
  # receives document bytes in a request body, so this limit is generous headroom for
  # ordinary JSON/form payloads only, not a document upload path.
  client_max_body_size 25m;

  include /etc/nginx/conf.d/*.conf;
}
